<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Ashborn Agent</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" href="/static/fire_emoji_svg.svg" type="image/svg+xml">
</head>
<body>

  <header class="header" id="header">
    <div class="container">
      <a href="/" class="header-brand">
        <img src="/static/fire_emoji_svg.svg" alt="Ashborn">
        <span>Ashborn</span>
      </a>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/pricing">Pricing</a>
      </nav>
    </div>
  </header>

  <main class="auth-section">
    <canvas id="hero-canvas"></canvas>
    
    <div class="auth-card reveal visible">
      <div class="auth-header">
        <h2>Join Ashborn</h2>
        <p>Start your autonomous development journey</p>
      </div>

      <form class="auth-form" id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-input" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 10px; justify-content: center;">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Login</a>
      </div>
    </div>
  </main>

  <script src="/static/script.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const response = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      
      const result = await response.json();
      if (result.status === 'success') {
        alert('Account created for ' + result.user + '!');
        window.location.href = '/login';
      }
    });
  </script>
</body>
</html>
