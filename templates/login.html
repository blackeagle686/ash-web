{% extends "base.html" %}

{% block title %}Login — Ashborn Agent{% endblock %}

{% block content %}
  <section class="auth-section">
    <canvas id="hero-canvas"></canvas>
    
    <div class="auth-card reveal visible">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Login to your Ashborn account</p>
      </div>

      <form class="auth-form" id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 10px; justify-content: center;">
          Login to Ashborn
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Create one</a>
      </div>
    </div>
  </section>
{% endblock %}

{% block extra_script %}
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      
      const result = await response.json();
      if (result.status === 'success') {
        alert('Welcome, ' + result.user + '!');
        window.location.href = '/';
      }
    });
  </script>
{% endblock %}
